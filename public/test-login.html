<!DOCTYPE html>
<html>
<head>
    <title>Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .error { border-color: red; background: #ffe6e6; }
        .success { border-color: green; background: #e6ffe6; }
    </style>
</head>
<body>
    <h1>Login API Test</h1>
    
    <form id="loginForm">
        <div>
            <label>Nama:</label>
            <input type="text" id="nama" value="Khansa Aurelia" required>
        </div>
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="Englishclubskarla1@gmail.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="test123" required>
        </div>
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result" class="result"></div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const result = document.getElementById('result');
            result.innerHTML = 'Sending request...';
            result.className = 'result';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ nama, email, password })
                });
                
                const data = await response.text();
                
                result.innerHTML = `
                    <strong>Status:</strong> ${response.status} ${response.statusText}<br>
                    <strong>Response:</strong> <pre>${data}</pre>
                `;
                
                if (response.ok) {
                    result.className = 'result success';
                } else {
                    result.className = 'result error';
                }
                
            } catch (error) {
                result.innerHTML = `<strong>Error:</strong> ${error.message}`;
                result.className = 'result error';
                console.error('Full error:', error);
            }
        });
    </script>
</body>
</html>
